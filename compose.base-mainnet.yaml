services:
  ollama:
    image: "docker.io/ollama/ollama:0.9.6"
    ports:
      - "11434:11434"
    volumes:
      - /storage/ollama:/root/.ollama
    entrypoint:
      ["/usr/bin/bash", "-c", "/bin/ollama serve & sleep 5; ollama pull gemma3:1b; wait"]

  oracle:
    build:
      dockerfile: ./Dockerfile.oracle
    image: ghcr.io/tradableapp/tokenized-ai-agent:base-mainnet-latest
    platform: linux/amd64
    entrypoint: /bin/sh -c 'node src/index.js'
