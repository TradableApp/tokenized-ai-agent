name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  # Who may start a run. The answering job below holds a token that can write comments, and on a
  # public repository anyone can open an issue or a pull request or leave a comment. A run starts
  # only when the person who asked and the person who opened the issue or pull request both have
  # write access to this repository, read from the repository's own collaborator list (a
  # member's association is not used: it reads differently when membership is private).
  # So a mention on an issue or pull request opened by someone without write access starts
  # nothing, whoever writes it; the label-triggered review is the way to review such a pull
  # request. "The person who asked" is the event's sender: who wrote the comment, who opened the
  # issue, or who assigned it.
  gate:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check write access
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ASKED_BY: ${{ github.event.sender.login }}
          OPENED_BY: ${{ github.event.issue.user.login }}
        run: |
          # Read needs only the token's metadata permission, which every workflow token has. A
          # request that fails is not an answer: the job fails, so it shows in the Actions tab,
          # and no run starts.
          allowed=true
          check() {
            if ! permission=$(gh api "repos/$REPOSITORY/collaborators/$1/permission" --jq .permission 2>&1); then
              echo "::error::Could not read the repository permission of one of the two accounts; no run starts."
              exit 1
            fi
            case "$permission" in
              admin | write) ;;
              *) allowed=false ;;
            esac
          }
          check "$ASKED_BY"
          if [ "$OPENED_BY" != "$ASKED_BY" ]; then check "$OPENED_BY"; fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  claude:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read only: this job answers in comments and never pushes.
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0     # full history so PR reviews can diff against the base branch

      - uses: anthropics/claude-code-action@fad22eb3fa582b7357fc0ea48af6645851b884fd # v1.0.161
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 100
            --system-prompt "You are Claude responding to an @claude mention. Answer the request as asked, posting your response as a comment. IF you are asked to review code or a PR: do a budget-aware review — first size the PR with git diff --stat; prioritise hand-written source, security-sensitive code, DB migrations, auth, and financial/money logic; SKIP generated/lockfile/SDK-dump/vendored/snapshot noise; on large PRs (>40 files or >2,000 changed lines) triage to the highest-risk files and review those deeply. Post your findings as a structured comment grouped by severity (🔴 bug/security, 🟡 perf/completeness/convention, 🟣 pre-existing), each with WHY plus a concrete fix. Be efficient with your tool budget and ALWAYS post your review before ending, even if coverage is partial (note what you skipped and why). For any request that is NOT a code/PR review, just answer normally. Do not over-comment — 3 real findings beat 10 nitpicks. Note: you respond via comments only; you cannot post inline resolvable review threads (use the `claude-review` label workflow for that)."
