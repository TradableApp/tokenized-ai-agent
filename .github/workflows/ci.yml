name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The shared-schema submodule is a separate PRIVATE repo, so the default
      # GITHUB_TOKEN cannot fetch it via `submodules: recursive`. Check it out
      # explicitly at the pinned submodule SHA using a PAT (same pattern as
      # sense-ai-core). Requires the org/repo secret SUBMODULE_PAT.
      - name: Resolve shared-schema submodule SHA
        id: submodule-sha
        run: echo "sha=$(git ls-tree HEAD packages/shared-schema | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Checkout shared-schema submodule
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TradableApp/sense-ai-shared-schema
          ref: ${{ steps.submodule-sha.outputs.sha }}
          token: ${{ secrets.SUBMODULE_PAT }}
          path: packages/shared-schema
          persist-credentials: false

      # The Brain submodule is likewise a separate PRIVATE repo (with its own
      # nested shared-schema submodule, needed to build its dist).
      - name: Resolve sense-ai-brain submodule SHA
        id: brain-sha
        run: echo "sha=$(git ls-tree HEAD oracle/packages/sense-ai-brain | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Checkout sense-ai-brain submodule
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TradableApp/sense-ai-brain
          ref: ${{ steps.brain-sha.outputs.sha }}
          token: ${{ secrets.SUBMODULE_PAT }}
          path: oracle/packages/sense-ai-brain
          persist-credentials: false

      - name: Resolve brain nested shared-schema SHA
        id: brain-schema-sha
        run: echo "sha=$(git -C oracle/packages/sense-ai-brain ls-tree HEAD packages/shared-schema | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Checkout brain nested shared-schema submodule
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TradableApp/sense-ai-shared-schema
          ref: ${{ steps.brain-schema-sha.outputs.sha }}
          token: ${{ secrets.SUBMODULE_PAT }}
          path: oracle/packages/sense-ai-brain/packages/shared-schema
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Compile contracts
        run: bun run compile

      - name: Test (contracts)
        run: bun run test

      - name: Lint (contracts)
        run: bun run lint

      # Build the Brain dist BEFORE the oracle install (bun copies path deps at
      # install time; the copy must contain dist/ and must NOT contain the
      # Brain's node_modules — its drizzle-orm devDependency would shadow the
      # host copy).
      - name: Prepare Brain package
        run: bun run prepare:brain

      - name: Install oracle dependencies
        run: cd oracle && bun install --frozen-lockfile

      # aiAgentOracle.js loads the plugin from its BUILT dist
      # (require("./elizaos/plugins/plugin-senseai/dist/index.js")), and dist/ is gitignored, so
      # a fresh checkout has none. Until now nothing here built it: the oracle's unit tests get
      # by because aiAgentOracle.test.js stubs that require via proxyquire, which meant a broken
      # plugin build could not fail CI — and any test that loads the real dist could not run at
      # all. Building it makes the plugin's own code genuinely covered (CU-86d3ud1va).
      - name: Install plugin-senseai dependencies
        run: cd oracle/src/elizaos/plugins/plugin-senseai && bun install --frozen-lockfile

      - name: Build plugin-senseai
        run: cd oracle/src/elizaos/plugins/plugin-senseai && bun run build

      # The plugin's own suite. Until CU-86d3z0r81 the plugin had no tests at all and none ran
      # here, so its providers, utils, and (from Phase 2) its actions were shipping uncovered —
      # the oracle's mocha suite only exercises the CJS host, and stubs the plugin dist entirely.
      # Phase 2 lands the analytical actions in this package, so it needs a gate now.
      - name: Test (plugin-senseai)
        run: cd oracle/src/elizaos/plugins/plugin-senseai && bun test

      - name: Test (oracle)
        run: cd oracle && bun run test

  # The leg that would have caught ta#64: that change was merged HERE and broke
  # sense-ai-e2e's bring-up, but no PR was ever opened against that repo, so nothing there
  # fired and it sat broken for six weeks. A PR-triggered workflow in sense-ai-e2e cannot
  # see this class of break; only the consumer telling it can.
  notify-e2e:
    name: Notify e2e
    needs: CI
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The dispatch job itself lives in TradableApp/.github so one edit reaches every consumer;
    # it used to be ~25 identical lines in each of four ci.yml files, which is how a known-wrong
    # 401 message survived in all four (fixing one string cost four PRs).
    #
    # Pinned to a SHA, not @main, and that is not pedantry here: SECRETS PASSED TO A REUSABLE
    # WORKFLOW ARE READABLE BY IT, so a floating ref would hand this repo's App private key to
    # whatever that branch contained at run time. Dependabot bumps the pin.
    uses: TradableApp/.github/.github/workflows/notify-e2e.yml@94a1c5fc6193b14699cc19ec3fe47b042d4d233b # v1.0.1
    permissions: {}
    secrets:
      app-id: ${{ secrets.E2E_DISPATCH_APP_ID }}
      app-private-key: ${{ secrets.E2E_DISPATCH_APP_PRIVATE_KEY }}
