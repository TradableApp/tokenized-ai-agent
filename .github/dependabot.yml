version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directories:
      - /
      - /oracle
      # Bundled ElizaOS plugin required at runtime by oracle/src/aiAgentOracle.js
      # (own package.json + bun.lock; ships axios/zod/@elizaos deps).
      - /oracle/src/elizaos/plugins/plugin-senseai
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      all-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The contract libraries are pinned to the versions the deployed bytecode was built and
      # reviewed against. A newer one changes that bytecode, so it is taken on purpose, in its
      # own change, never in a grouped update. Security updates are not held back by this.
      - dependency-name: "@openzeppelin/contracts"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@openzeppelin/contracts-upgradeable"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@oasisprotocol/sapphire-contracts"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
